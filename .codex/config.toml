# Repo-local Codex configuration for codex-patch.
#
# The agentic replay launcher copies this file plus repo-local prompts and skills
# into .codex-runtime/codex-home, then sets:
# - HOME -> .codex-runtime/home
# - CODEX_HOME -> .codex-runtime/codex-home
# - CODEX_SQLITE_HOME -> .codex-runtime/sqlite-home
#
# That keeps Codex from reading the user's global ~/.codex/config.toml and
# ~/.agents/skills while making this repository's tracked Codex inputs
# authoritative for replay runs.
#
# When ~/.codex/auth.json exists, the launcher bridges it into the runtime
# CODEX_HOME so official OpenAI replay auth stays outside git.

model_provider = "openai"
model = "gpt-5.4"
service_tier = "fast"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"

[skills.bundled]
enabled = true
