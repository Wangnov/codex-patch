# Repo-local Codex configuration for codex-patch.
#
# The agentic replay launcher sets:
# - HOME -> .codex-runtime/home
# - CODEX_HOME -> .codex
# - CODEX_SQLITE_HOME -> .codex-runtime/sqlite-home
#
# That keeps Codex from reading the user's global ~/.codex/config.toml and
# ~/.agents/skills while making this repository's .codex/ tree authoritative.
#
# This repository is public, so private provider details are intentionally
# sourced from local runtime inputs instead of being committed here.

model_provider = "vm"
model = "gpt-5.4"
service_tier = "fast"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"

[model_providers.vm]
name = "vm"
wire_api = "responses"
# The replay launcher injects model_providers.vm.base_url at runtime from
# CODEX_PATCH_VM_BASE_URL.
env_key = "CODEX_PATCH_VM_API_KEY"
env_key_instructions = "Set CODEX_PATCH_VM_API_KEY and CODEX_PATCH_VM_BASE_URL before running codex exec or replay workflows."

[skills.bundled]
enabled = true
